<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican Riding a Bicycle</title>
<!--
  A pelican riding a bicycle – everything on screen is SVG, generated by the script below.

  How it is put together
    · The scene is a stack of SVG layers (sky and sea, clouds, headlands, hills, meadow, roadside,
      road, cast shadow, the rider, foreground grass, light effects).  Scenery layers are drawn once
      – textures, depth-of-field and motion blur included – and then only slid sideways at different
      speeds for parallax.
    · The rider is split into rigid parts (wheels, crank, body, wing, tail, head …) that the browser
      rasterises once and then just moves; only the legs, chain, pouch and eye are redrawn per frame.
      The legs are solved with inverse kinematics so the feet stay on the pedals.
    · The shadow on the road is a second, flat copy of the rider, sheared onto the ground plane.

  Click the picture to pause or resume.
-->
<style>
  html, body { height: 100%; margin: 0; background: #0b0d12; }
  body { display: grid; place-items: center; overflow: hidden; }
  #stage {
    position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9;
    overflow: hidden; cursor: pointer; background: #86b4dc; contain: layout paint; container-type: inline-size;
  }
  #stage svg { position: absolute; left: 0; top: 0; display: block; overflow: hidden; pointer-events: none; }
  #stage svg.full { width: 100%; height: 100%; }
  #stage svg.scroll, #stage svg.part { will-change: transform; }
  #stage svg.part { overflow: visible; }
  #riderWrap { position: absolute; inset: 0; }

  .glit   { animation: tw 1.3s ease-in-out infinite alternate; }
  .glit.b { animation-duration: 1.9s; animation-delay: -.7s; }
  .glit.c { animation-duration: 2.7s; animation-delay: -1.5s; }
  @keyframes tw { from { opacity: .2; } to { opacity: 1; } }

  #gulls { will-change: transform; animation: fly 70s linear infinite; }
  @keyframes fly { from { transform: translate(370%, 12%); } to { transform: translate(-110%, -30%); } }

  /* motes and butterflies drift across on the compositor; cqw = 1% of the stage width */
  #stage svg.mote { will-change: transform; animation: m0 12s linear infinite; }
  #stage svg.mote.m1 { animation-name: m1; }
  #stage svg.mote.m2 { animation-name: m2; }
  @keyframes m0 { 0% { transform: translate(108cqw, 0); } 30% { transform: translate(76cqw, -2cqw); } 62% { transform: translate(40cqw, 1.4cqw); } 100% { transform: translate(0, -1cqw); } }
  @keyframes m1 { 0% { transform: translate(108cqw, 1cqw); } 25% { transform: translate(81cqw, 2.8cqw); } 55% { transform: translate(48cqw, -.7cqw); } 100% { transform: translate(0, 1.6cqw); } }
  @keyframes m2 { 0% { transform: translate(108cqw, -1.4cqw); } 40% { transform: translate(65cqw, .7cqw); } 70% { transform: translate(32cqw, -2.5cqw); } 100% { transform: translate(0, .2cqw); } }
  .flap { animation: flap .12s ease-in-out infinite alternate; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.25); } }

  #light { mix-blend-mode: screen; }
  #grade { mix-blend-mode: soft-light; }
  #stage svg#grain {
    mix-blend-mode: overlay; opacity: .075; width: 110%; height: 110%; left: -5%; top: -5%;
    animation: gr .5s steps(1) infinite;
  }
  @keyframes gr {
    0%  { transform: translate(0, 0); }       17% { transform: translate(-2%, 1.5%); }
    33% { transform: translate(1.5%, -2.5%); } 50% { transform: translate(-3%, -1%); }
    67% { transform: translate(2.5%, 2%); }    83% { transform: translate(-1%, 3%); }
  }
  #stage.paused svg, #stage.paused .flap { animation-play-state: paused !important; }
</style>
</head>
<body>
<div id="stage" role="img" aria-label="A white pelican riding a red bicycle along a coastal road in late-afternoon light. Click to pause or resume."></div>
<script>
(() => {
'use strict';
/* ================================================================
   Core helpers
   ================================================================ */
const NS = 'http://www.w3.org/2000/svg';
const W = 1600, H = 900;                 // scene size in SVG user units
const TAU = Math.PI * 2;
const stage = document.getElementById('stage');

const SUN = { x: 1335, y: 185 };         // sun position in the frame
const SX = 0.75, SY = 0.22;              // ground-shadow projection per unit of height
const G = 720;                           // ground line under the tyres

const SHAPES = { path: 1, rect: 1, circle: 1, ellipse: 1, line: 1 };
const el = (tag, attrs, parent) => {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) {
    // On plain shapes, group opacity and paint opacity look the same – but paint opacity lets the
    // browser keep the shape in its parent's raster layer instead of compositing it separately.
    if (k === 'opacity' && SHAPES[tag]) {
      if (attrs.fill !== 'none') e.setAttribute('fill-opacity', attrs[k]);
      if (attrs.stroke && attrs.stroke !== 'none') e.setAttribute('stroke-opacity', attrs[k]);
    } else e.setAttribute(k, attrs[k]);
  }
  if (parent) parent.appendChild(e);
  return e;
};
const f1 = v => Math.round(v * 10) / 10;
const f2 = v => Math.round(v * 100) / 100;
const deg = r => r * 180 / Math.PI;
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// small seeded PRNG so the scenery is identical on every load
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// periodic value noise / fbm on u in [0,1) – used for seamless terrain profiles
function pnoise(seed, cells) {
  const r = rng(seed), v = [];
  for (let i = 0; i < cells; i++) v.push(r());
  return u => {
    const x = ((u % 1) + 1) % 1 * cells, i = Math.floor(x), f = x - i, s = f * f * (3 - 2 * f);
    return v[i % cells] + (v[(i + 1) % cells] - v[i % cells]) * s;
  };
}
function fbm(seed, cells, oct) {
  const ns = [];
  for (let o = 0; o < oct; o++) ns.push(pnoise(seed + o * 17, cells << o));
  return u => { let s = 0, a = 1, n = 0; for (const f of ns) { s += f(u) * a; n += a; a *= .5; } return s / n; };
}

let _id = 0;
const nid = () => 'i' + (_id++);
function stops(g, list) {
  for (const [o, c, a] of list) {
    const s = el('stop', { offset: o, 'stop-color': c }, g);
    if (a !== undefined) s.setAttribute('stop-opacity', a);
  }
}
function lin(defs, x1, y1, x2, y2, list, obb) {
  const id = nid();
  stops(el('linearGradient', { id, x1, y1, x2, y2, gradientUnits: obb ? 'objectBoundingBox' : 'userSpaceOnUse' }, defs), list);
  return `url(#${id})`;
}
function rad(defs, cx, cy, r, list, opt) {
  const id = nid(), a = { id, cx, cy, r, gradientUnits: opt && opt.obb ? 'objectBoundingBox' : 'userSpaceOnUse' };
  if (opt && opt.gt) a.gradientTransform = opt.gt;
  stops(el('radialGradient', a, defs), list);
  return `url(#${id})`;
}
function blurF(defs, sx, sy, region) {
  const id = nid(), a = { id };
  if (region) Object.assign(a, { filterUnits: 'userSpaceOnUse', x: region[0], y: region[1], width: region[2], height: region[3] });
  else Object.assign(a, { x: '-30%', y: '-30%', width: '160%', height: '160%' });
  el('feGaussianBlur', { stdDeviation: sx + ' ' + sy }, el('filter', a, defs));
  return `url(#${id})`;
}
// ragged, leafy edges for foliage
function leafF(defs, scale, freq, seed) {
  const id = nid(), f = el('filter', { id, x: '-20%', y: '-20%', width: '140%', height: '140%' }, defs);
  el('feTurbulence', { type: 'fractalNoise', baseFrequency: freq, numOctaves: 2, seed: seed || 3, result: 'n' }, f);
  el('feDisplacementMap', { in: 'SourceGraphic', in2: 'n', scale, xChannelSelector: 'R', yChannelSelector: 'G' }, f);
  return `url(#${id})`;
}

const polar = (c, r, aDeg) => ({ x: c.x + r * Math.cos(aDeg * Math.PI / 180), y: c.y + r * Math.sin(aDeg * Math.PI / 180) });
function arcPath(c, r, a0, a1) {
  const p0 = polar(c, r, a0), p1 = polar(c, r, a1);
  return `M${f2(p0.x)},${f2(p0.y)}A${r},${r} 0 ${Math.abs(a1 - a0) > 180 ? 1 : 0} ${a1 > a0 ? 1 : 0} ${f2(p1.x)},${f2(p1.y)}`;
}
const circ = (x, y, r) => `M${f1(x - r)},${f1(y)}a${f1(r)},${f1(r)} 0 1 0 ${f1(2 * r)},0a${f1(r)},${f1(r)} 0 1 0 ${f1(-2 * r)},0Z`;
const elli = (x, y, rx, ry) => `M${f1(x - rx)},${f1(y)}a${f1(rx)},${f1(ry)} 0 1 0 ${f1(2 * rx)},0a${f1(rx)},${f1(ry)} 0 1 0 ${f1(-2 * rx)},0Z`;

function profilePath(fn, T, yBottom, step) {
  let d = `M-30,${yBottom}`;
  for (let x = -30; x <= T + 30; x += step) d += `L${x},${f1(fn(x))}`;
  return d + `L${T + 30},${yBottom}Z`;
}
function bladeD(x, y, h, lean, w) {
  return `M${f1(x - w / 2)},${f1(y)}Q${f1(x + lean * .2)},${f1(y - h * .6)} ${f1(x + lean)},${f1(y - h)}` +
         `Q${f1(x + lean * .45 + w * .3)},${f1(y - h * .5)} ${f1(x + w / 2)},${f1(y)}Z`;
}
// many grass blades, batched into one path per colour (dark colours first, backlit ones in front)
function grass(parent, r, n, T, yFn, hMin, hMax, palette, wScale) {
  const b = palette.map(() => '');
  for (let i = 0; i < n; i++) {
    const x = r() * T, y = yFn(x, r), h = hMin + (hMax - hMin) * r() * r();
    const k = Math.floor(r() * palette.length), lean = (r() - .64) * h * .55, w = (1.5 + r() * 2.2) * (wScale || 1);
    b[k] += bladeD(x, y, h, lean, w);
    if (x < 50) b[k] += bladeD(x + T, y, h, lean, w); else if (x > T - 50) b[k] += bladeD(x - T, y, h, lean, w);
  }
  palette.forEach((c, k) => el('path', { d: b[k], fill: c }, parent));
}

/* Chrome only bakes SVG filters into a layer's raster (instead of re-running them in the compositor on
   every frame) when the filtered content can be merged into an existing layer that already spans it.
   A practically invisible full-size rect at the start of each SVG guarantees that. */
const BASE = { fill: '#808080', 'fill-opacity': .004 };
function svgFull(id) {
  const s = el('svg', { id, viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', class: 'full' }, stage);
  el('rect', { x: -100, y: -100, width: W + 200, height: H + 200, ...BASE }, s);
  return s;
}

// a static layer that only covers the horizontal band y0..y1 of the scene
function svgBand(id, y0, y1) {
  const s = el('svg', { id, viewBox: `0 ${y0} ${W} ${y1 - y0}`, preserveAspectRatio: 'none' }, stage);
  s.style.cssText = `top:${y0 / H * 100}%;height:${(y1 - y0) / H * 100}%;width:100%`;
  el('rect', { x: -100, y: y0 - 100, width: W + 200, height: y1 - y0 + 200, ...BASE }, s);
  return s;
}

/* A scrolling layer is two identical tile-sized SVGs that leap-frog each other.  Each is rasterised by the
   browser with its textures and blur baked in, and afterwards only moved by the compositor. */
const scrollers = [];
function scrollLayer(y0, y1, T, speed, build, drift) {
  const els = [];
  for (let k = 0; k < 2; k++) {
    const svg = el('svg', { viewBox: `0 ${y0} ${T + 2} ${y1 - y0}`, preserveAspectRatio: 'none', class: 'scroll' }, stage);
    svg.style.top = (y0 / H * 100) + '%';
    svg.style.height = ((y1 - y0) / H * 100) + '%';
    svg.style.width = ((T + 2) / W * 100) + '%';
    const defs = el('defs', {}, svg);
    el('rect', { x: -300, y: y0 - 80, width: T + 600, height: y1 - y0 + 160, ...BASE }, svg);
    // wrap(x, margin, fn): draw at x, and again one tile over when it would straddle a tile edge
    const wrap = (x, m, fn) => { fn(x); if (x < m) fn(x + T); else if (x > T - m) fn(x - T); };
    // span(g): the same trick inside a filtered group, so nested effects merge into it as well
    const span = g => el('rect', { x: -280, y: y0 - 70, width: T + 560, height: y1 - y0 + 140, ...BASE }, g);
    build({ tile: el('g', {}, svg), defs, T, wrap, span });
    els.push(svg);
  }
  scrollers.push({ els, T, speed, drift: drift || 0 });
}
function updateScroll(dist, t) {
  for (const s of scrollers) {
    const T = s.T, o = (dist * s.speed + t * s.drift) % (2 * T);
    let a = -o; if (a < -T) a += 2 * T;
    let b = a + T; if (b >= T) b -= 2 * T;
    s.els[0].style.transform = `translate3d(${(a / (T + 2) * 100).toFixed(4)}%,0,0)`;
    s.els[1].style.transform = `translate3d(${(b / (T + 2) * 100).toFixed(4)}%,0,0)`;
  }
}
/* ================================================================
   Sky, sun and sea (static)
   ================================================================ */
{
  const s = svgBand('sky', 0, 660), d = el('defs', {}, s), r = rng(9);
  el('rect', { width: W, height: 476, fill: lin(d, 0, 0, 0, 470,
    [[0, '#2a66ab'], [.28, '#5390cc'], [.58, '#92bce1'], [.84, '#d5e2ea'], [1, '#f3e6cd']]) }, s);
  el('rect', { width: W, height: 476, fill: rad(d, SUN.x, SUN.y, 640,
    [[0, '#fffbf0', 1], [.05, '#fff4d8', .95], [.16, '#ffe6b4', .6], [.4, '#ffdcae', .24], [1, '#ffdcae', 0]]) }, s);
  el('circle', { cx: SUN.x, cy: SUN.y, r: 60, fill: '#fff6dc', opacity: .7, filter: blurF(d, 18, 18) }, s);
  el('circle', { cx: SUN.x, cy: SUN.y, r: 31, fill: '#fffef8', filter: blurF(d, 4, 4) }, s);

  // sea
  el('rect', { y: 455, width: W, height: 200, fill: lin(d, 0, 455, 0, 650,
    [[0, '#d2e1e5'], [.05, '#9ac1d1'], [.25, '#5797b1'], [.6, '#2f7997'], [1, '#1c617d']]) }, s);
  el('rect', { y: 455, width: W, height: 200, fill: rad(d, 0, 0, 1,
    [[0, '#fff3cf', .8], [.4, '#ffe2a8', .32], [1, '#ffe2a8', 0]], { gt: `translate(${SUN.x} 455) scale(360 210)` }) }, s);
  let dl = '', dd = '';
  for (let i = 0; i < 300; i++) {                         // swell lines, sparser and thicker toward the viewer
    const u = r(), y = 458 + u * u * 190, len = 8 + (y - 455) * (.4 + r() * 1.3), x = r() * W, th = .5 + (y - 455) * .008;
    const p = `M${f1(x)},${f1(y)}h${f1(len)}v${f1(th)}h${f1(-len)}Z`;
    if (r() < .5) dl += p; else dd += p;
  }
  el('path', { d: dl, fill: '#e8f4f8', opacity: .24 }, s);
  el('path', { d: dd, fill: '#0e475f', opacity: .2 }, s);
  el('rect', { y: 448, width: W, height: 16, fill: lin(d, 0, 448, 0, 464,
    [[0, '#ffffff', 0], [.5, '#fff7e4', .5], [1, '#ffffff', 0]]) }, s);   // haze on the horizon
}

// sun glitter on the water – three small layers twinkling out of phase
['', 'b', 'c'].forEach((c, k) => {
  const s = el('svg', { viewBox: '0 455 1600 200', preserveAspectRatio: 'none', class: 'glit ' + c }, stage);
  s.style.cssText = `top:${455 / 9}%;height:${200 / 9}%;width:100%`;
  const r = rng(40 + k); let d = '';
  for (let i = 0; i < 170; i++) {
    const u = r(), y = 456.5 + u * u * 185, sp = 18 + (y - 455) * .9, gx = (r() + r() + r() - 1.5) / 1.5;
    const len = 2 + (y - 455) * .11 * (.3 + r()), th = .7 + (y - 455) * .012;
    d += `M${f1(SUN.x + gx * sp)},${f1(y)}h${f1(len)}v${f1(th)}h${f1(-len)}Z`;
  }
  el('path', { d, fill: '#fffbe6' }, s);
});

/* ================================================================
   Clouds – procedural (fractal noise → soft alpha, grey undersides)
   ================================================================ */
scrollLayer(0, 470, 2400, 0.004, ({ tile, defs, T, span }) => {
  const mk = (freq, seed, k, off, col, shade) => {
    const id = nid(), f = el('filter', { id, filterUnits: 'userSpaceOnUse', x: 0, y: 0, width: T + 2, height: 470,
      'color-interpolation-filters': 'sRGB' }, defs);
    el('feTurbulence', { type: 'fractalNoise', baseFrequency: freq, numOctaves: 5, seed, stitchTiles: 'stitch', result: 'n' }, f);
    el('feColorMatrix', { in: 'n', values: `0 0 0 0 ${col[0]}  0 0 0 0 ${col[1]}  0 0 0 0 ${col[2]}  ${k} 0 0 0 ${off}`, result: 'c' }, f);
    if (shade) {
      el('feOffset', { in: 'c', dx: 0, dy: 10, result: 'o' }, f);
      el('feColorMatrix', { in: 'o', values: '0 0 0 0 .62  0 0 0 0 .68  0 0 0 0 .80  0 0 0 .9 0', result: 's' }, f);
      const m = el('feMerge', { result: 'c' }, f); el('feMergeNode', { in: 's' }, m); el('feMergeNode', { in: 'c' }, m);
    }
    el('feComposite', { in: 'c', in2: 'SourceAlpha', operator: 'in' }, f);     // × the rect's own vertical fade
    return `url(#${id})`;
  };
  const fade = o => lin(defs, 0, 0, 0, 470, [[0, '#fff', .45 * o], [.22, '#fff', o], [.55, '#fff', .8 * o], [.8, '#fff', .12 * o], [1, '#fff', 0]]);
  el('rect', { width: T + 2, height: 470, fill: fade(.55), filter: mk('0.0012 0.016', 5, 2.4, -1.22, [1, 1, 1], false) }, tile);       // cirrus
  el('rect', { width: T + 2, height: 470, fill: fade(1), filter: mk('0.0028 0.0092', 23, 3.4, -1.9, [1, .985, .95], true) }, tile);  // cumulus
}, 5);

// a few distant gulls gliding across
{
  const s = el('svg', { id: 'gulls', viewBox: '30 42 110 36' }, stage);
  s.style.cssText = 'top:19%;width:27.5%;height:16%';
  [[60, 58, 1], [84, 66, .7], [42, 72, .8], [130, 50, .55]].forEach(([x, y, k]) =>
    el('path', { d: `M${x - 5 * k},${y}q${2.5 * k},${-3 * k} ${5 * k},0q${2.5 * k},${-3 * k} ${5 * k},0`, fill: 'none',
      stroke: '#34405a', 'stroke-width': .7 * k, 'stroke-linecap': 'round', 'stroke-opacity': .75 }, s));
}

/* ================================================================
   Far headlands across the bay (speed 0.012)
   ================================================================ */
scrollLayer(350, 472, 2400, 0.012, ({ tile, defs, T, span }) => {
  const fA = fbm(21, 6, 4), fB = fbm(44, 5, 4);
  const g = el('g', { filter: blurF(defs, .8, .8, [-70, 350, T + 140, 125]) }, tile);
  span(g);
  el('path', { d: profilePath(x => 456 - Math.max(0, fA(x / T) * 110 - 30), T, 459, 6),
    fill: lin(defs, 0, 395, 0, 458, [[0, '#a5bbd2'], [1, '#cbdae3']]) }, g);
  const hb = x => 457 - Math.max(0, fB(x / T + .3) * 180 - 84);
  el('path', { d: profilePath(hb, T, 460, 6), fill: lin(defs, 0, 380, 0, 458, [[0, '#7b95b0'], [.7, '#90a9c1'], [1, '#bccfdb']]) }, g);
  // lighthouse on the highest point
  let bx = 0, by = 999; for (let x = 0; x < T; x += 6) if (hb(x) < by) { by = hb(x); bx = x; }
  el('path', { d: `M${bx - 2.4},${by + 2}L${bx - 1.6},${by - 15}h3.2L${bx + 2.4},${by + 2}Z`, fill: '#f1ede4' }, g);
  el('rect', { x: bx - 2.2, y: by - 19, width: 4.4, height: 4, fill: '#8d3b34' }, g);
  // sailboats on the horizon
  [[640, 465, 1], [1730, 463, .8], [2190, 466, 1.15]].forEach(([x, y, k]) => {
    el('path', { d: `M${x},${y}l${1.5 * k},${-13 * k}l${6 * k},${12 * k}Z`, fill: '#fbf8f0' }, tile);
    el('path', { d: `M${x - 1 * k},${y}l${0.8 * k},${-10 * k}l${-5 * k},${9.4 * k}Z`, fill: '#e3e6ea' }, tile);
    el('rect', { x: x - 6 * k, y, width: 14 * k, height: 1.8 * k, rx: .8, fill: '#3b4658' }, tile);
  });
});

/* ================================================================
   Coastal hills (speed 0.10)
   ================================================================ */
scrollLayer(440, 672, 2400, 0.1, ({ tile, defs, T, wrap, span }) => {
  const r = rng(77), f = fbm(91, 4, 4), top = x => 476 + 66 * f(x / T);
  const g = el('g', { filter: blurF(defs, 1.9, 1.3, [-70, 440, T + 140, 235]) }, tile);
  span(g);
  const rag = leafF(defs, 5, .11, 5);
  el('path', { d: profilePath(top, T, 674, 10), fill: lin(defs, 0, 470, 0, 664,
    [[0, '#c9c188'], [.2, '#a8ae68'], [.6, '#869d56'], [1, '#70904a']]) }, g);
  // sun-struck crest and field stripes
  let crest = ''; for (let x = -30; x <= T + 30; x += 10) crest += (x === -30 ? 'M' : 'L') + x + ',' + f1(top(x) + 1.5);
  el('path', { d: crest, fill: 'none', stroke: '#f1e7ae', 'stroke-width': 3, opacity: .5 }, g);
  for (let i = 0; i < 34; i++) {
    const x0 = r() * T, y = top(x0) + 14 + r() * 90, w = 90 + r() * 260, a = { rx: w, ry: 3 + r() * 8, fill: r() < .5 ? '#dcd493' : '#66874a', opacity: .12 + r() * .2 };
    wrap(x0, w + 20, x => el('ellipse', { cx: x, cy: y, ...a }, g));
  }
  // groves and hedgerows of small, distant trees
  const groves = []; for (let i = 0; i < 18; i++) groves.push([r() * T, r()]);
  let dD = '', dM = '', dL = '', dS = '';

const LEATHER = ['#3f2110', '#7d4620', '#b47236', '#ecba84'];
const LIN = lin, RAD = rad;

// mk(region, origin) → { g, pose(dx, dy, deg) }   – one drawing surface per rigid part, in z-order
function buildRider(mk, defs, isShadow) {
  const O = { x: 0, y: 0 };
  const farL   = mk([690, 350, 230, 360]);
  const tyreL  = mk([520, 490, 575, 235]);
  const wrL    = mk([RH.x - 114, RH.y - 114, 228, 228], RH);
  const wfL    = mk([FH.x - 114, FH.y - 114, 228, 228], FH);
  const bikeL  = mk([505, 315, 600, 415]);
  const chainL = mk([618, 585, 195, 80]);
  const crankL = mk([BB.x - 62, BB.y - 62, 124, 124], BB);
  const tailL  = mk([585, 325, 125, 110], { x: 676, y: 376 });
  const bodyL  = mk([640, 220, 275, 205]);
  const NK = { x: 850, y: 262 };                 // the neck pivots here; head, pouch, bill and eye share it
  const headL  = mk([790, 100, 120, 200], NK);
  const pouchL = mk([852, 158, 190, 86], NK);
  const billL  = mk([870, 125, 195, 110], NK);
  const eyeL   = mk([878, 138, 16, 16], NK);
  const legL   = mk([690, 350, 250, 360]);
  const wingL  = mk([670, 245, 250, 205], { x: 832, y: 268 });
  const bike = bikeL.g;

  // the shadow copy needs silhouettes only: every paint collapses to a flat colour
  const lin = isShadow ? () => '#111' : (...a) => LIN(defs, ...a);
  const rad = isShadow ? () => '#111' : (...a) => RAD(defs, ...a);

  // straight tube with a cylinder-shaded gradient across its width
  function tube(p, x1, y1, x2, y2, w, pal, cap) {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
    let nx = -dy / L, ny = dx / L;
    if (nx * LIGHT.x + ny * LIGHT.y < 0) { nx = -nx; ny = -ny; }
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, h = w / 2;
    const fill = lin(f2(mx - nx * h), f2(my - ny * h), f2(mx + nx * h), f2(my + ny * h),
      [[0, pal[0]], [.3, pal[1]], [.62, pal[2]], [.78, pal[3]], [.92, pal[2]], [1, pal[1]]]);
    return el('line', { x1, y1, x2, y2, stroke: fill, 'stroke-width': w, 'stroke-linecap': cap || 'round' }, p);
  }
  // curved tube: stacked strokes shifted toward the light
  function ctube(p, d, w, pal) {
    const a = { d, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
    el('path', { ...a, stroke: pal[0], 'stroke-width': w }, p);
    if (isShadow) return;
    el('path', { ...a, stroke: pal[1], 'stroke-width': w * .72, transform: `translate(${f2(LIGHT.x * w * .1)} ${f2(LIGHT.y * w * .1)})` }, p);
    el('path', { ...a, stroke: pal[2], 'stroke-width': w * .36, transform: `translate(${f2(LIGHT.x * w * .2)} ${f2(LIGHT.y * w * .2)})` }, p);
    el('path', { ...a, stroke: pal[3], 'stroke-width': w * .12, opacity: .85, transform: `translate(${f2(LIGHT.x * w * .27)} ${f2(LIGHT.y * w * .27)})` }, p);
  }

  // shared paints (wheel paints are in wheel-local coordinates)
  const tanG = lin(-100, -100, 100, 100, [[0, '#b98d58'], [.45, '#a57a48'], [1, '#6f4f2c']]);
  const rimG = lin(75, -75, -75, 75, [[0, '#ffffff'], [.16, '#c8ccd2'], [.34, '#878d96'], [.5, '#e6e8eb'], [.68, '#737982'], [.86, '#cdd1d6'], [1, '#8d939c']]);
  const hubG = rad(3, -3, 11, [[0, '#ffffff'], [.5, '#b9bec6'], [1, '#5c626b']]);
  const amberG = lin(0, 0, 1, 0, [[0, '#ffd27a'], [.5, '#ff9a1c'], [1, '#c96a08']], true);
  const steelV = lin(0, 0, 0, 1, [[0, '#f4f6f8'], [.45, '#aab0b9'], [1, '#5a6069']], true);

  // ---------- parts that exist on both sides ----------
  function crankArm(p) {
    el('path', { d: `M0,-6.5L${CRANK},-5A5,5 0 0 1 ${CRANK},5L0,6.5A6.5,6.5 0 0 1 0,-6.5Z`, fill: steelV, stroke: '#4d535c', 'stroke-width': .6 }, p);
    el('circle', { r: 5.2, fill: hubG }, p); el('circle', { r: 2, fill: '#3a3d44' }, p);
    el('circle', { cx: CRANK, r: 2.6, fill: '#6d737c' }, p);
  }
  function pedal(p) {
    const g = el('g', {}, p);
    el('rect', { x: -18, y: -4.2, width: 36, height: 8.4, rx: 2.2, fill: '#26282d' }, g);
    el('rect', { x: -18, y: -4.2, width: 36, height: 2, rx: 1, fill: '#8b9099' }, g);
    el('rect', { x: -18.6, y: -2.6, width: 5, height: 5.2, rx: 1, fill: '#ffae2b' }, g);
    el('rect', { x: 13.6, y: -2.6, width: 5, height: 5.2, rx: 1, fill: '#ffae2b' }, g);
    el('circle', { r: 2.8, fill: '#c9cdd3' }, g);
    return g;
  }
  function leg(p) {
    const shin = el('g', {}, p), thigh = el('g', {}, p), foot = el('g', {}, p);
    // lower leg: orange, scaly tarsus
    el('path', { d: `M0,-8.5L${L2 - 6},-6.5C${L2 + 4},-6.5 ${L2 + 4},6.5 ${L2 - 6},6.5L0,8.5C-9,8.5 -9,-8.5 0,-8.5Z`,
      fill: lin(0, 0, 0, 1, [[0, '#ffbd63'], [.4, '#ee8e2c'], [1, '#b05a15']], true) }, shin);
    el('circle', { cx: L2, r: 8.6, fill: rad(L2 + 2, -3, 10, [[0, '#ffc470'], [1, '#c96a1a']]) }, shin);
    // upper leg: feathered
    el('path', { d: `M-8,-31C38,-36 108,-22 146,-13C160,-9 160,9 148,13C110,23 40,35 -8,31C-24,20 -24,-20 -8,-31Z`,
      fill: lin(0, 0, 0, 1, [[0, '#fffaf0'], [.4, '#ebe8e8'], [1, '#9fa6c0']], true) }, thigh);
    el('path', { d: 'M134,-15l24,7l-17,2l19,6l-19,3l15,8l-24,-1Z', fill: '#d5d8e2' }, thigh);
    // webbed foot, resting on the pedal
    el('path', { d: 'M-22,-8l-10,8l12,-2Z', fill: '#b05a15' }, foot);
    el('path', { d: 'M-23,-24C-12,-28 -3,-21 2,-13C14,-10 30,-8 43,-5C48,-4 48,1 43,1.5L-18,1C-27,-1 -30,-18 -23,-24Z',
      fill: lin(0, 0, 0, 1, [[0, '#ffbd63'], [.5, '#ea872a'], [1, '#aa5512']], true) }, foot);
    if (!isShadow) {
      let sc = ''; for (let x = 12; x < L2 - 6; x += 8) sc += `M${x},-7.4l1.6,14.6`;
      el('path', { d: sc, stroke: '#9c4b0c', 'stroke-width': .8, opacity: .28, fill: 'none' }, shin);
      el('path', { d: `M4,-7L${L2 - 8},-5.4`, stroke: '#ffe0a6', 'stroke-width': 1.5, opacity: .75, 'stroke-linecap': 'round', fill: 'none' }, shin);
      el('path', { d: 'M18,-12q7,7 14,0M42,-5q7,7 14,0M28,8q7,7 14,0M64,-9q6,6 12,0M60,9q6,6 12,0M88,-1q6,6 12,0M110,-5q5,5 10,0M106,7q5,5 10,0',
        fill: 'none', stroke: '#6b7496', 'stroke-width': 1, opacity: .3 }, thigh);
      el('path', { d: 'M-2,-29C40,-33 104,-21 142,-13', fill: 'none', stroke: '#fff7df', 'stroke-width': 2.4, opacity: .9, 'stroke-linecap': 'round' }, thigh);
      el('path', { d: 'M-12,-16L40,-3.4M-13,-11L27,.4M-14,-7L8,.8', fill: 'none', stroke: '#a04d0c', 'stroke-width': .9, opacity: .5 }, foot);
      el('path', { d: 'M-16,-22C-8,-22 -2,-17 3,-12C14,-9.5 28,-7.6 41,-5', fill: 'none', stroke: '#ffe0a6', 'stroke-width': 1.3, opacity: .8 }, foot);
      el('path', { d: 'M43,-5l6.5,3.2l-6.5,2Z', fill: '#35281c' }, foot);
    }
    return { thigh, shin, foot };
  }
  const ringA = { fill: 'none' };
  function tyre(c) {                                   // the parts of a wheel that look the same at any angle
    const g = el('g', { transform: `translate(${c.x} ${c.y})` }, tyreL.g);
    el('circle', { ...ringA, r: 104.8, stroke: '#17171a', 'stroke-width': 14.4 }, g);
    el('circle', { ...ringA, r: 94.8, stroke: rimG, 'stroke-width': 7.6 }, g);
    if (isShadow) return;
    el('circle', { ...ringA, r: 101.4, stroke: tanG, 'stroke-width': 5.4 }, g);                       // gum sidewall
    el('circle', { ...ringA, r: 104.3, stroke: '#0a0a0b', 'stroke-width': .8, opacity: .55 }, g);
    el('path', { ...ringA, d: arcPath(O, 109.8, -80, -8), stroke: '#fff4dc', 'stroke-width': 2.4, 'stroke-linecap': 'round', opacity: .32 }, g);
    el('circle', { ...ringA, r: 98.4, stroke: '#5f656e', 'stroke-width': .7 }, g);
    el('circle', { ...ringA, r: 91.2, stroke: '#4f555e', 'stroke-width': .8 }, g);
    el('path', { ...ringA, d: arcPath(O, 95, -72, -30), stroke: '#fffaf0', 'stroke-width': 3.4, 'stroke-linecap': 'round', opacity: .9 }, g);
  }
  function spokes(L, c, rear) {                        // the parts that turn
    const g = el('g', { transform: `translate(${c.x} ${c.y})` }, L.g);
    let dA = '', dB = '';
    for (let i = 0; i < 32; i++) {                     // tangentially laced
      const a = i / 32 * TAU, ha = a + (i % 2 ? 1 : -1) * 1.22;
      const s = `M${f2(8.5 * Math.cos(ha))},${f2(8.5 * Math.sin(ha))}L${f2(91 * Math.cos(a))},${f2(91 * Math.sin(a))}`;
      if (i % 4 < 2) dA += s; else dB += s;
    }
    el('path', { ...ringA, d: dB, stroke: '#878d96', 'stroke-width': .9, opacity: .8 }, g);
    el('path', { ...ringA, d: dA, stroke: '#e9ecef', 'stroke-width': .9, opacity: .85 }, g);
    el('path', { d: 'M92,0L80,0', stroke: '#2a2a2c', 'stroke-width': 2.4 }, g);                       // valve
    el('path', { d: 'M82.5,0L79,0', stroke: '#c9a646', 'stroke-width': 3.4 }, g);
    el('rect', { x: 56, y: -13, width: 9, height: 26, rx: 2.2, fill: amberG, stroke: '#9c5406', 'stroke-width': .6, transform: 'rotate(100)' }, g);
    if (!isShadow) for (const a of [200, 20]) el('path', { ...ringA, d: arcPath(O, 101.4, a, a + 26), stroke: '#f6e7c6', 'stroke-width': 3, opacity: .8 }, g);
    if (rear) {
      el('circle', { ...ringA, r: COG, stroke: '#9096a0', 'stroke-width': 3, 'stroke-dasharray': '2.2 2.355' }, g);
      el('circle', { r: COG - 1.6, fill: '#7d838c' }, g);
    }
  }

  // ---------- far side first: crank, pedal and leg seen through the frame ----------
  const far = el('g', {}, farL.g);
  if (!isShadow) {
    const id = nid(), f = el('filter', { id, x: '-20%', y: '-20%', width: '140%', height: '140%', 'color-interpolation-filters': 'sRGB' }, defs);
    el('feColorMatrix', { values: '.62 0 0 0 0  0 .64 0 0 0  0 0 .74 0 0  0 0 0 1 0' }, f);
    far.setAttribute('filter', `url(#${id})`);
    el('rect', { x: 690, y: 350, width: 230, height: 360, ...BASE }, far);
  }
  const farCrank = el('g', {}, el('g', { transform: `translate(${BB.x} ${BB.y})` }, far));
  crankArm(farCrank);
  const farPedal = pedal(far), farLeg = leg(far);

  // ---------- wheels, mudguards ----------
  tyre(RH); tyre(FH); spokes(wrL, RH, true); spokes(wfL, FH, false);
  for (const [c, a] of [[RH, -150], [RH, -214], [FH, -200]]) {
    const q = polar(c, 119, a); tube(bike, c.x, c.y, q.x, q.y, 2.4, STEEL);
  }
  ctube(bike, arcPath(RH, 119, 6, -218), 9, STEEL);
  ctube(bike, arcPath(FH, 119, -46, -205), 9, STEEL);
  { // rear lamp and front mud flap
    const q = polar(RH, 124, -203);
    el('rect', { x: q.x - 4.5, y: q.y - 8, width: 9, height: 16, rx: 2.5, fill: lin(0, 0, 1, 0, [[0, '#7a0d12'], [.6, '#e02a2e'], [1, '#ff8d80']], true),
      stroke: '#3a0608', 'stroke-width': .7, transform: `rotate(-23 ${f1(q.x)} ${f1(q.y)})` }, bike);
    const m = polar(FH, 119, -205), m2 = polar(FH, 121, -214);
    el('path', { d: `M${f1(m.x)},${f1(m.y)}L${f1(m2.x)},${f1(m2.y)}`, stroke: '#1b1b1e', 'stroke-width': 8, 'stroke-linecap': 'round' }, bike);
  }
  for (const c of [RH, FH]) el('circle', { cx: c.x, cy: c.y, r: 9.5, fill: hubG, stroke: '#565c65', 'stroke-width': .7 }, bike);

  // ---------- frame ----------
  tube(bike, 731, 471, RH.x, RH.y, 7, RED);                 // seat stays
  tube(bike, BB.x, BB.y, RH.x, RH.y, 8, RED);               // chain stays
  tube(bike, 705, 506, 691, 528, 4, STEEL);                 // rear brake caliper
  tube(bike, 727, 463, 714.5, 430, 7.5, STEEL);             // seat post
  tube(bike, BB.x, BB.y, 727, 463, 11.5, RED);              // seat tube
  tube(bike, 921.5, 487, BB.x, BB.y, 12.5, RED);            // down tube
  tube(bike, 729.5, 470.5, 911, 455.5, 11, RED);            // top tube
  ctube(bike, 'M924,494C931,516 938,540 945.6,560.6Q956,594 975,608', 9, RED);   // fork
  tube(bike, 925, 497, 936, 520, 4, STEEL);                 // front brake caliper
  tube(bike, 909, 448, 924, 494, 15.5, RED);                // head tube
  for (const c of [RH, FH]) el('path', { d: `M${c.x - 7},${c.y - 6}l10,-2l4,8l-6,7l-8,-3Z`, fill: '#aab0b9', stroke: '#4d535c', 'stroke-width': .6 }, bike);
  if (!isShadow) {
    el('path', { d: arcPath(RH, 121.5, -32, -84), fill: 'none', stroke: '#fffdf2', 'stroke-width': 2.2, 'stroke-linecap': 'round' }, bike);
    el('path', { d: arcPath(FH, 121.5, -50, -84), fill: 'none', stroke: '#fffdf2', 'stroke-width': 2.2, 'stroke-linecap': 'round' }, bike);
    el('rect', { x: 686, y: 524, width: 9, height: 5, rx: 1, fill: '#1c1c1f', transform: 'rotate(-58 691 527)' }, bike);
    el('rect', { x: 931.5, y: 518.5, width: 9, height: 5, rx: 1, fill: '#1c1c1f', transform: 'rotate(-24 936 521)' }, bike);
    const cream = ['#b9a57c', '#e9dab4', '#fff6dc', '#ffffff'];
    tube(bike, 763.4, 582.2, 761.9, 577.4, 12, cream, 'butt'); tube(bike, 760, 571, 759.1, 568.1, 12, cream, 'butt');
    el('path', { d: 'M905,407C925,432 918,447 902,450L748,463.5C736,466 716,492 706,505', fill: 'none', stroke: '#17171a', 'stroke-width': 1.5 }, bike);
    tube(bike, 908.2, 445.5, 909.8, 450.5, 17.5, STEEL, 'butt'); tube(bike, 923.2, 491.5, 924.8, 496.5, 17.5, STEEL, 'butt');
    el('ellipse', { cx: 916.5, cy: 471, rx: 4.6, ry: 7.5, fill: '#e3bd62', stroke: '#8a6a22', 'stroke-width': .7, transform: 'rotate(-18 916.5 471)' }, bike);
    tube(bike, 726.2, 460.5, 727.8, 465.5, 13.5, STEEL, 'butt');   // seat collar
    el('circle', { cx: BB.x, cy: BB.y, r: 9.5, fill: hubG, stroke: '#4d535c', 'stroke-width': .8 }, bike);
    for (const c of [RH, FH]) { el('circle', { cx: c.x, cy: c.y, r: 5, fill: hubG, stroke: '#3d4249', 'stroke-width': .8 }, bike); el('circle', { cx: c.x, cy: c.y, r: 1.8, fill: '#2a2c31' }, bike); }
  }

  // ---------- drivetrain: chain (redrawn), chainring + near crank (one rigid, turning layer) ----------
  const base = Math.atan2(RH.y - BB.y, RH.x - BB.x), off = Math.acos((RING - COG) / Math.hypot(RH.x - BB.x, RH.y - BB.y));
  const aT = deg(base + off), aB = deg(base - off);
  const t1 = polar(BB, RING + .6, aT), t2 = polar(RH, COG + .6, aT), b2 = polar(RH, COG + .6, aB), b1 = polar(BB, RING + .6, aB);
  const chainD = `M${f2(t1.x)},${f2(t1.y)}L${f2(t2.x)},${f2(t2.y)}A${COG + .6},${COG + .6} 0 0 0 ${f2(b2.x)},${f2(b2.y)}` +
                 `L${f2(b1.x)},${f2(b1.y)}A${RING + .6},${RING + .6} 0 1 0 ${f2(t1.x)},${f2(t1.y)}`;
  el('path', { d: chainD, fill: 'none', stroke: '#26272b', 'stroke-width': 3.3 }, chainL.g);
  const chain = isShadow ? null : el('path', { d: chainD, fill: 'none', stroke: '#a5aab2', 'stroke-width': 1.7, 'stroke-dasharray': '2.6 2.6' }, chainL.g);
  const ring = el('g', { transform: `translate(${BB.x} ${BB.y})` }, crankL.g);
  el('circle', { r: RING, fill: 'none', stroke: '#9aa0a9', 'stroke-width': 3.2, 'stroke-dasharray': '2.1 2.116' }, ring);
  el('circle', { r: 21, fill: 'none', stroke: rimG, 'stroke-width': 5.6 }, ring);
  if (!isShadow) el('circle', { r: 18.2, fill: 'none', stroke: '#6f757e', 'stroke-width': .7 }, ring);
  for (let i = 0; i < 5; i++) el('path', { d: 'M5,0L19.5,0', stroke: '#bfc4cb', 'stroke-width': 5.4, 'stroke-linecap': 'round', transform: `rotate(${i * 72 + 36})` }, ring);
  crankArm(ring);

  // ---------- saddle ----------
  el('path', { d: 'M750,426L686,434M686,447L716,436', stroke: '#b9bec6', 'stroke-width': 2.2, fill: 'none' }, bike);
  for (const x of [676, 691]) el('path', { d: `M${x},431l5,2l-10,3l10,3l-10,3l10,3l-5,2`, fill: 'none', stroke: '#c9cdd3', 'stroke-width': 1.7, 'stroke-linejoin': 'round' }, bike);
  el('rect', { x: 707, y: 428, width: 15, height: 8, rx: 2, fill: steelV, stroke: '#4d535c', 'stroke-width': .6 }, bike);
  el('path', { d: 'M762,419C742,410 706,413 690,410C678,407 668,405 662,410C655,416 659,428 670,430C696,432 732,428 762,423Z',
    fill: lin(0, 404, 0, 432, [[0, '#d4995b'], [.35, '#9c5d2d'], [1, '#562f14']]) }, bike);
  if (!isShadow) {
    el('path', { d: 'M757,417.4C738,411 706,414 690,411C680,409 672,407 666,410', fill: 'none', stroke: '#f6cf9c', 'stroke-width': 1.5, opacity: .8 }, bike);
    for (const [x, y] of [[667, 420], [675, 425], [753, 421.4]]) el('circle', { cx: x, cy: y, r: 1.6, fill: '#e5bf78' }, bike);
    el('path', { d: 'M908,406C950,398 964,440 940,470L930,495', fill: 'none', stroke: '#17171a', 'stroke-width': 1.5 }, bike);   // front brake cable
  }

  // ---------- cockpit: stem, bar, lever, bell ----------
  tube(bike, 909, 448, 902, 424, 8, STEEL);
  tube(bike, 902, 425, 934, 418, 9, STEEL);
  ctube(bike, 'M934,418C942,400 926,395 908,397.5L868,400.5', 7, STEEL);
  el('circle', { cx: 934, cy: 418, r: 6.4, fill: hubG, stroke: '#4d535c', 'stroke-width': .7 }, bike);
  ctube(bike, 'M908,404C898,410 884,414 871,415', 3.8, STEEL);
  el('rect', { x: 902, y: 398, width: 9, height: 9, rx: 2, fill: '#2a2c31' }, bike);
  tube(bike, 904.5, 397.8, 867.5, 400.6, 12.5, LEATHER);
  el('circle', { cx: 866.4, cy: 400.7, r: 6.3, fill: '#4a2812' }, bike);
  el('circle', { cx: 921, cy: 391.5, r: 7.6, fill: rad(923.5, 388.5, 9, [[0, '#ffffff'], [.4, '#d5d9de'], [1, '#5f656e']]) }, bike);
  el('rect', { x: 918, y: 397.5, width: 6, height: 4, fill: '#3c3e45' }, bike);
  if (!isShadow) {
    el('path', { d: 'M898,392.5l1,11M889,393l1,11M880,393.8l1,11M871,394.4l1,11', stroke: '#3a1e0d', 'stroke-width': .8, opacity: .55, fill: 'none' }, bike);
    el('circle', { cx: 866.4, cy: 400.7, r: 2.6, fill: '#d9dde2' }, bike);
  }

  // ---------- head lamp ----------
  tube(bike, 926, 492, 944, 478, 2.6, STEEL);
  if (!isShadow) el('circle', { cx: 964, cy: 476.5, r: 20, fill: rad(962, 476.5, 20, [[0, '#fff7c4', .75], [.4, '#ffe890', .25], [1, '#ffe890', 0]]) }, bike);
  el('path', { d: 'M938,468C944,464 954,465 958,468L958,485C954,488 944,489 938,485C934,480 934,473 938,468Z', fill: steelV, stroke: '#4d535c', 'stroke-width': .7 }, bike);
  if (!isShadow) {
    el('path', { d: 'M940,469C945,466.5 952,467 956,469', fill: 'none', stroke: '#ffffff', 'stroke-width': 1.6, 'stroke-linecap': 'round' }, bike);
    el('ellipse', { cx: 958.6, cy: 476.5, rx: 3.2, ry: 8.8, fill: '#fff8cf', stroke: '#b99a3f', 'stroke-width': .8 }, bike);
  }

  // ---------- wicker basket with the day's catch ----------
  tube(bike, 934, 416, 948, 402, 3, STEEL);

  el('rect', { width: W, height: H, ...BASE }, g);
  for (let i = 0; i < 10; i++) {
    const a = 104 + i * 7.4 + r() * 4, da = 1 + r() * 2.6, L = 760 + r() * 520;
    const p = polar(SUN, L, a - da), q = polar(SUN, L, a + da);
    el('path', { d: `M${SUN.x},${SUN.y}L${f1(p.x)},${f1(p.y)}L${f1(q.x)},${f1(q.y)}Z`,
      fill: rad(d, SUN.x, SUN.y, L, [[0, '#fff0c2', .44], [.5, '#ffe7b0', .2], [1, '#ffe7b0', 0]]) }, g);
  }
  // lens-flare ghosts along the line through the centre of the frame
  const ghost = (k, rr, col, o, ringed) => {
    const x = SUN.x + (800 - SUN.x) * k, y = SUN.y + (450 - SUN.y) * k;
    el('circle', { cx: x, cy: y, r: rr, fill: rad(d, x, y, rr, ringed ? [[0, col, 0], [.78, col, o * .35], [.92, col, o], [1, col, 0]] : [[0, col, o], [.7, col, o * .6], [1, col, 0]]) }, s);
  };
  ghost(.24, 13, '#9dffc8', .16); ghost(1.13, 9, '#8fd8ff', .2); ghost(1.32, 22, '#ffb36b', .1);
  ghost(1.56, 46, '#ff9fd0', .08, true); ghost(1.92, 74, '#b9c8ff', .07, true);
}
// Dust motes and butterflies: tiny elements moved purely by CSS keyframes on the compositor.
{
  const r = rng(404);
  const speck = (cls, top, size, dur) => {
    const s = el('svg', { viewBox: '-20 -20 40 40', class: cls }, stage);
    s.style.cssText = `left:-5%;top:${top.toFixed(1)}%;width:${size}%;aspect-ratio:1;overflow:visible;animation-duration:${dur.toFixed(2)}s;animation-delay:${(-r() * dur).toFixed(2)}s`;
    return s;
  };
  for (let i = 0; i < 30; i++) {
    const big = i < 7, rr = big ? 9 + r() * 9 : 1.6 + r() * 2.6;
    const s = speck('mote m' + (i % 3), 36 + r() * 54, 2.2, big ? 5 + r() * 3 : 9 + r() * 9);
    el('circle', { r: f1(rr), fill: big ? '#fff2c4' : '#fff8dc', 'fill-opacity': f2(big ? .06 + r() * .07 : .25 + r() * .4) }, s);
  }
  for (const [col, edge, top] of [['#f6a12a', '#3a2412', 61], ['#fbf6e6', '#6b6f78', 65], ['#f3d640', '#5a4a12', 58]]) {
    const s = speck('mote m' + Math.floor(r() * 3), top, 2.2, 2.4 + r() * .8), w = el('g', { class: 'flap' }, s);
    el('path', { d: 'M0,0C-3,-9 -12,-11 -13,-4C-13,1 -6,3 0,0ZM0,0C-2,5 -9,8 -10,3C-9,0 -4,-1 0,0Z', fill: col, stroke: edge, 'stroke-width': .7 }, w);
    el('path', { d: 'M-1,-1.5L5,1.5', stroke: edge, 'stroke-width': 1.5, 'stroke-linecap': 'round' }, s);
  }
}
{
  const s = svgFull('grade'), d = el('defs', {}, s);
  el('rect', { width: W, height: H, fill: lin(d, W, 0, 0, H, [[0, '#ffb347', .3], [.45, '#ffb347', .06], [1, '#27468a', .22]]) }, s);
  el('rect', { width: W, height: H, fill: rad(d, 800, 430, 1020, [[0, '#02040c', 0], [.55, '#02040c', 0], [1, '#02040c', .8]]) }, s);   // vignette
}
{
  const s = svgFull('grain'), d = el('defs', {}, s), id = nid();
  const f = el('filter', { id, filterUnits: 'userSpaceOnUse', x: 0, y: 0, width: W, height: H, 'color-interpolation-filters': 'sRGB' }, d);
  el('feTurbulence', { type: 'fractalNoise', baseFrequency: .85, numOctaves: 2, seed: 2 }, f);
  el('feColorMatrix', { values: '1.6 0 0 0 -.3  1.6 0 0 0 -.3  1.6 0 0 0 -.3  0 0 0 0 1' }, f);
  el('rect', { width: W, height: H, filter: `url(#${id})` }, s);
}

/* ================================================================
   Animation
   ================================================================ */
const CADENCE = 5.0;                       // crank speed, rad/s (≈ 48 rpm)
let lastShade = -1;
function draw(t) {
  const crank = CADENCE * t, wheel = crank * GEAR, dist = wheel * R;
  updateScroll(dist, t);

  const bp = t % 4.3;
  const st = {
    crank, wheelDeg: deg(wheel) % 360, chainOff: (crank * (RING + .6)) % 5.2,
    bob: 1.5 * Math.sin(2 * crank + .6),
    nod: 1.2 * Math.sin(2 * crank - .5) + .6 * Math.sin(t * .7),
    pouch: 2.6 * Math.sin(2 * crank - 1.4) + 1.2 * Math.sin(t * 9.3),
    tail: 1.5 * Math.sin(t * 8.1) + .8 * Math.sin(t * 13.7),
    wing: .45 * Math.sin(t * 6.3) + .2 * Math.sin(t * 11),
    blink: bp < .16 ? Math.max(.1, Math.abs(1 - bp / .08)) : 1
  };
  poseMain(st); poseShadow(st);

  // where tree shadows already darken the road, the rider's own shadow fades into them
  // (the rider itself keeps its light – the trees' shadows lie low across the ground)
  const rx = (dist + 790) % ROAD_T;
  let sh = 0;
  for (const c of TREE_SHADOWS) {
    let dx = Math.abs(rx - c.x); dx = Math.min(dx, ROAD_T - dx);
    sh = Math.max(sh, 1 - smooth(c.w * .26, c.w * .62, dx));
  }
  if (Math.abs(sh - lastShade) > .008) {
    lastShade = sh;
    setCast(1 - .8 * sh);
  }
}

let playing = true, last = null, time = 0;
function frame(now) {
  if (last === null) last = now;
  const dt = Math.min((now - last) / 1000, .1);
  last = now;
  if (playing) { time += dt; draw(time); }
  requestAnimationFrame(frame);
}
stage.addEventListener('click', () => { playing = !playing; stage.classList.toggle('paused', !playing); });
window.__seek = t => { time = t; draw(t); };      // handy for inspecting a single frame
draw(0);
requestAnimationFrame(frame);
})();
</script>
